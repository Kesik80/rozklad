<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Расписюлька</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Розклад">
<meta id="themeColorMeta" name="theme-color" content="#f2f2f7">
<meta property="og:title" content="Розклад Терешки">
<meta property="og:type" content="website">
<link rel="manifest" href="/icons/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192x192.png">
<link rel="icon" href="/icons/favicon.ico" sizes="32x32">
<meta name="msapplication-config" content="/browserconfig.xml">
<link rel="stylesheet" href="app.css">
<!-- тема ставиться ДО малювання сторінки, щоб не було світлого «спалаху» -->
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body data-page="index">
<div id="app-splash">
  <div class="curtain curtain-left"></div>
  <div class="curtain curtain-right"></div>
  <div class="splash-content">
    <img src="/icons/icon-192x192.png" class="splash-icon" alt="">
    <div class="splash-title">Розклад</div>
  </div>
</div>
<script>
// Заставка — тільки в встановленому додатку (standalone). У браузері прибираємо одразу.
(function () {
  window.__isStandaloneApp = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  var el = document.getElementById('app-splash');
  if (window.__isStandaloneApp) {
    el.querySelector('.curtain-left').classList.add('run');
    el.querySelector('.curtain-right').classList.add('run');
  } else if (el) {
    el.remove();
  }
})();
</script>
<header class="hdr"></header>
<main id="app"></main>

<script src="schedule-data.js"></script>
<script src="pwa-install.js"></script>
<script src="splash-screen.js"></script>
<script>if (window.__isStandaloneApp) SplashScreen.init();</script>
<script src="app.js"></script>
<script src="console.js"></script>
</body>
</html>
