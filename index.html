<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Расписюлька</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Розклад">
<meta id="themeColorMeta" name="theme-color" content="#f2f2f7">
<meta property="og:title" content="Розклад Терешки">
<meta property="og:type" content="website">
<link rel="manifest" href="/icons/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192x192.png">
<link rel="icon" href="/icons/favicon.ico" sizes="32x32">
<meta name="msapplication-config" content="/browserconfig.xml">
<link rel="stylesheet" href="app.css">
<!-- тема ставиться ДО малювання сторінки, щоб не було світлого «спалаху» -->
<script>try{var t=localStorage.getItem('theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.getElementById('themeColorMeta').setAttribute('content',t==='dark'?'#000000':'#f2f2f7')}catch(e){}</script>
<!-- Chrome не буферизує beforeinstallprompt: ловимо його тут, поки не завантажився pwa-install.js -->
<script>window.__pwaPromptEvent=null;window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__pwaPromptEvent=e;if(window.__pwaOnPrompt)window.__pwaOnPrompt(e)});</script>
</head>
<body data-page="index" data-install="banner">
<div id="app-splash">
  <div class="splash-content">
    <img src="/icons/icon-192x192.png" class="splash-icon" alt="">
    <div class="splash-title">РАСПИСЮЛЬКА</div>
  </div>
</div>
<script>
// Заставка — лише при ЗАПУСКУ встановленого додатку (standalone), один раз за запуск.
// Повернення на головну з іншої сторінки заставку не показує.
(function () {
  var standalone = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  var seen = false;
  try { seen = sessionStorage.getItem('splashShown') === '1'; } catch (e) {}
  try { if (document.referrer && new URL(document.referrer).origin === location.origin) seen = true; } catch (e) {}
  window.__showSplash = standalone && !seen;
  var el = document.getElementById('app-splash');
  if (window.__showSplash) {
    try { sessionStorage.setItem('splashShown', '1'); } catch (e) {}
  } else if (el) {
    el.remove();
  }
})();
</script>
<header class="hdr"></header>
<main id="app"></main>

<script src="schedule-data.js"></script>
<script src="pwa-install.js"></script>
<script src="splash-screen.js"></script>
<script>if (window.__showSplash) SplashScreen.init();</script>
<script src="app.js"></script>
<script src="console.js"></script>
</body>
</html>
