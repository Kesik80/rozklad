<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">

<!-- тема ставиться ДО малювання сторінки, щоб не було світлого «спалаху» -->
<script>try{var t=localStorage.getItem('theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.getElementById('themeColorMeta').setAttribute('content',t==='dark'?'#121212':'#f2f2f7')}catch(e){}</script>
</head>
<body data-page="vovkivka">
<header class="hdr"></header>
<main id="app"></main>

<script src="schedule-data.js"></script>
<script src="pwa-install.js"></script>
<script src="app.js"></script>
<script src="console.js"></script>
</body>
</html>
